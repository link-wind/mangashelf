spring:
  application:
    name: mangashelf
  autoconfigure:
    # 嵌入模型由 EmbeddingConfig 按需装配（模型文件缺失不阻塞启动）
    exclude: org.springframework.ai.model.transformers.autoconfigure.TransformersEmbeddingModelAutoConfiguration

  datasource:
    url: ${MANGASHELF_DB_URL:jdbc:postgresql://localhost:5432/mangashelf}
    username: ${MANGASHELF_DB_USER:mangashelf}
    password: ${MANGASHELF_DB_PASSWORD:mangashelf}

  flyway:
    enabled: ${MANGASHELF_DB_MIGRATE:true}

  rabbitmq:
    addresses: ${MANGASHELF_RABBITMQ_ADDRESSES:localhost:5672}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

  session:
    jdbc:
      # 开发环境由 Spring Session JDBC 自动建表（SPRING_SESSION / SPRING_SESSION_ATTRIBUTES）
      initialize-schema: always

  # Jackson 3（Boot 4 默认）日期默认输出 ISO-8601，无需 write-dates-as-timestamps 配置

server:
  port: ${MANGASHELF_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

# 请求日志贯穿 request_id/user_id（DESIGN 20.2；RequestObservabilityFilter 写入 MDC）
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS+08:00} %-5level [%X{request_id:-}] [%X{user_id:-}] %logger{36} - %msg%n"

mangashelf:
  # M0 固定演示 owner；M1 identity 落地后移除（validate-core-stack tasks.md 收尾项）
  demo-owner-id: ${MANGASHELF_DEMO_OWNER_ID:00000000-0000-0000-0000-000000000001}

  # 平台来源标识（DESIGN 17.2）：稳定生成，不用可变域名充当来源
  platform-id: ${MANGASHELF_PLATFORM_ID:mangashelf-instance-local}

  # 首次启动引导管理员密码；已有密码不会被覆盖。生产环境必须显式设置。
  admin-password: ${MANGASHELF_ADMIN_PASSWORD:mangashelf-admin}

  storage:
    endpoint: ${MANGASHELF_S3_ENDPOINT:http://localhost:9000}
    region: ${MANGASHELF_S3_REGION:us-east-1}
    bucket: ${MANGASHELF_S3_BUCKET:mangashelf}
    access-key: ${MANGASHELF_S3_ACCESS_KEY:mangashelf}
    secret-key: ${MANGASHELF_S3_SECRET_KEY:mangashelf-secret}
    path-style: true
    presign-ttl-seconds: ${MANGASHELF_PRESIGN_TTL_SECONDS:600}

  redis:
    enabled: ${MANGASHELF_REDIS_ENABLED:false}
    address: ${MANGASHELF_REDIS_ADDRESS:localhost:6379}
    command-timeout-ms: 1000
    connect-timeout-ms: 500

  jobs:
    lease-seconds: ${MANGASHELF_JOB_LEASE_SECONDS:120}
    heartbeat-seconds: 30
    dispatch-interval-ms: 500
    recovery-interval-ms: 10000
    max-dispatch-attempts: 5

  bangumi:
    enabled: ${MANGASHELF_BANGUMI_ENABLED:true}
    proxy: ${MANGASHELF_BANGUMI_PROXY:}
  mail:
    enabled: ${MANGASHELF_MAIL_ENABLED:false}
    host: ${MANGASHELF_MAIL_HOST:}
    port: ${MANGASHELF_MAIL_PORT:465}
    ssl: ${MANGASHELF_MAIL_SSL:true}
    starttls: ${MANGASHELF_MAIL_STARTTLS:false}
    username: ${MANGASHELF_MAIL_USERNAME:}
    password: ${MANGASHELF_MAIL_PASSWORD:}
    from: ${MANGASHELF_MAIL_FROM:}
    code-ttl-minutes: ${MANGASHELF_MAIL_CODE_TTL_MINUTES:10}
    resend-cooldown-seconds: ${MANGASHELF_MAIL_RESEND_COOLDOWN_SECONDS:60}
    max-daily-per-email: ${MANGASHELF_MAIL_MAX_DAILY_PER_EMAIL:10}
    max-hourly-per-ip: ${MANGASHELF_MAIL_MAX_HOURLY_PER_IP:20}
  bilibili:
    proxy: ${MANGASHELF_BILIBILI_PROXY:}
    cache-root: ${MANGASHELF_BILIBILI_CACHE_ROOT:${mangashelf.processing.work-root}/../bilibili-http-cache}
    cache-max-bytes: ${MANGASHELF_BILIBILI_CACHE_MAX_BYTES:536870912}
    detail-ttl-seconds: ${MANGASHELF_BILIBILI_DETAIL_TTL_SECONDS:1800}
    index-ttl-seconds: ${MANGASHELF_BILIBILI_INDEX_TTL_SECONDS:600}
    image-ttl-seconds: ${MANGASHELF_BILIBILI_IMAGE_TTL_SECONDS:604800}
  embedding:
    # 本地 ONNX 嵌入（e5-small-v2，384 维）；模型文件不入库
    enabled: ${MANGASHELF_EMBEDDING_ENABLED:true}
    model-path: ${MANGASHELF_EMBEDDING_MODEL_PATH:./models/e5-small-v2.onnx}
    tokenizer-path: ${MANGASHELF_EMBEDDING_TOKENIZER_PATH:./models/tokenizer.json}

  # 拷贝漫画浏览器源（M29）：登录后由 processing.manga_login 生成 storage_state，
  # 或直接在环境变量里给 Cookie 串（二者其一）。
  copymanga:
    proxy: ${MANGASHELF_COPYMANGA_PROXY:}
    cookie: ${MANGASHELF_COPYMANGA_COOKIE:}
    storage-state: ${MANGASHELF_COPYMANGA_STORAGE_STATE:}

  processing:
    python-binary: ${MANGASHELF_PYTHON:python3}
    # 包含 processing 包的目录（仓库根），Python 经 PYTHONPATH 导入
    package-root: ${MANGASHELF_PROCESSING_ROOT:..}
    work-root: ${MANGASHELF_WORK_ROOT:./data/jobs}
    task-timeout-seconds: 600
    # 解析防护上限（DESIGN 10.3），由 Java 下发给任务，不信任用户声明
    archive-max-entries: ${MANGASHELF_ARCHIVE_MAX_ENTRIES:2000}
    archive-max-total-bytes: ${MANGASHELF_ARCHIVE_MAX_TOTAL_BYTES:524288000}
    archive-max-file-bytes: ${MANGASHELF_ARCHIVE_MAX_FILE_BYTES:104857600}
