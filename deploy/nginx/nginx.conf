# GemiNeko（杰米猫）站点：静态 + API/媒体同源反代 + SEO 爬虫预渲染（DESIGN 19）。
# 多实例（multi-instance-deployment）：upstream 多上游；单实例保持默认；
# 启用第二副本时取消 api-2 行注释并重建 web 容器。
upstream mangashelf_api {
    server api:8080;
    # server api-2:8080;
}

# 仅匹配搜索引擎与社交分享预览爬虫（绝不匹配微信/QQ 等真人内置浏览器）
map $http_user_agent $is_seo_bot {
    default 0;
    ~*(googlebot|bingbot|baiduspider|yandexbot|sogou|360spider|bytespider|duckduckbot|applebot|twitterbot|facebookexternalhit|telegrambot|discordbot|slackbot|whatsapp|linkedinbot|pinterestbot|embedly) 1;
}

server {
    listen 80;
    server_name _;
    add_header Referrer-Policy "no-referrer" always;

    location = /robots.txt {
        proxy_pass http://mangashelf_api/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sitemap.xml {
        proxy_pass http://mangashelf_api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/ {
        proxy_pass http://mangashelf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 130s;
        client_max_body_size 600m;
    }

    # 签名媒体直读（Host 经 changeOrigin/签名以目标主机计算，转发保持原样；
    # 关闭响应缓冲 + 强制 Range + HTTP/1.1 长连接，避免大视频先落盘拖慢首帧 TTFB）
    location ^~ /media/ {
        proxy_pass http://storage:9000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host storage:9000;
        proxy_buffering off;
        proxy_force_ranges on;
        client_max_body_size 600m;
    }

    # Vite 带哈希静态资源长缓存
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 根目录静态图片/图标/字体始终直出静态文件，不被爬虫预渲染拦截
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico|css|js|mjs|woff2?|ttf|map|json|webmanifest)$ {
        root /usr/share/nginx/html;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache";
    }

    location @seo_prerender {
        rewrite ^(.*)$ /api/v1/seo/render?path=$1 break;
        proxy_pass http://mangashelf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        error_page 418 = @seo_prerender;
        if ($is_seo_bot) {
            return 418;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
